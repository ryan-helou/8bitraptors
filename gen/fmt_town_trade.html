location sign, head sprites with name tags, a white RPG dialog box with typewriter text and pop-ups (stamp, list, stat card,

Everything team-specific comes from the spec: beats[0].txt = every string shown on screen (fact-checked), beats[0].stat.shots =
layout + timing (absolute seconds), crest / opponent logos via "l:ABBR", heads via "p:<espn id>", companion via "m:<monster>".
Text refs: a string starting with "@" is looked up in beats[0].txt. All drawing is our own canvas pixel art. -->

 SH.forEach((sh,i)=>{if(i>0&&sh.fade!==false)at(sh.t,'whoosh');if(sh.glow)at(sh.glow[0],'chime');
  (sh.pages||[]).forEach(p=>{if(p.pre)return;const n=tx(p.dlg).replace(/\|/g,'').length,d=n/(p.cps||CPS);for(let k=0;k<d;k+=.09)at(p.t+.05+k,'step')});
  (sh.pops||[]).forEach(p=>{at(p.t,p.sfx||(p.type==='menu'?'confirm':p.type==='big'?'chime':'appear'));if(p.type==='menu')(p.moves||[]).forEach(m=>at(m[0],'blip'));if(p.type==='stat')for(let k=0;k<8;k++)at(p.t+.15+k*.18,'blip');if(p.type==='list')(p.at||[]).forEach(a=>at(a,'blip'));if(p.type==='card'&&p.tagt!=null)at(p.tagt,'blip')});
  (sh.sprites||[]).forEach(s=>{if(s.in!=null&&s.in>sh.t+.05)at(s.in,'appear');if(s.ball!=null)at(s.ball,'attack');if(s.bub)at(s.bub[0],'alert');if(s.path)for(let k=s.path[0][0];k<s.path[s.path.length-1][0];k+=.13)at(k,'step')})});
 return E.sort((a,b)=>a.t-b.t)};
window.setData=async d=>{D=d;B0=d.story.beats[0];TX=B0.txt||{};SH=(B0.stat&&B0.stat.shots)||[];CPS=d.story.cps||B0.stat.cps||40;
 // sprite keys arrive resolved by gen/history.py ("p:123" -> "p_123", "l:TOR" -> "l_TOR", "m:x" -> "m_x")
 await Promise.all([...Object.entries(d.assets).map(([k,u])=>new Promise(r=>{const i=new Image();i.onload=()=>{IM[k]=i;r()};i.onerror=()=>r();i.src=u})),document.fonts.load('20px PM'),document.fonts.load('20px PMB'),document.fonts.load('20px PO8')]);TC.clear()};
